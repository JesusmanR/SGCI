version: '3.9'

networks:
  sgci-internal-net:
    driver: bridge
    name: sgci-internal-net

services:
  sgci-postgres:
    image: postgres:16-alpine
    container_name: sgci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgci_multitenant
      POSTGRES_USER: sgci_user
      POSTGRES_PASSWORD: sgci_secret_password
    ports:
      # Aislamiento de red: enlace exclusivo a loopback local (127.0.0.1) para evitar exposición pública
      - '127.0.0.1:5432:5432'
    volumes:
      - sgci_pgdata:/var/lib/postgresql/data
    networks:
      - sgci-internal-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgci_user -d sgci_multitenant']
      interval: 10s
      timeout: 5s
      retries: 5

  sgci-redis:
    image: redis:7-alpine
    container_name: sgci-redis
    restart: unless-stopped
    ports:
      # Aislamiento de red: enlace exclusivo a loopback local (127.0.0.1) para evitar exposición pública
      - '127.0.0.1:6379:6379'
    networks:
      - sgci-internal-net

  sgci-frontend:
    image: node:20-alpine
    container_name: sgci-frontend
    working_dir: /app
    volumes:
      - ./:/app
    command: node scripts/servidor-sgci.mjs
    ports:
      - '4173:4173'
    environment:
      PORT: 4173
    networks:
      - sgci-internal-net
    depends_on:
      - sgci-postgres
      - sgci-redis

volumes:
  sgci_pgdata:

