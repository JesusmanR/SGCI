name: CI/CD SGCI — Quality Gates, TDD & Multi-Tenant Security (Sprints 1–10)

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditoria-arquitectura-prisma-pantallas-sgci:
    name: 1. Esquema Prisma, Multi-Tenant & 25 Pantallas Oficiales SGCI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio SGCI
        uses: actions/checkout@v4

      - name: Verificar esquema declarativo Prisma y aislamiento tenant_id
        run: |
          test -f database/prisma/schema.prisma
          grep -q "tenant_id" database/prisma/schema.prisma
          echo "Esquema Prisma con aislamiento Multi-Tenant verificado."

      - name: Verificar integración de las 47 capturas oficiales SGCI (22 Menú + 15 Escritorio + 10 Móvil)
        run: |
          test -f frontend/public/artifacts/sgci-pantallas/manifest.json
          TOTAL_SGCI_PNG=$(find frontend/public/artifacts/sgci-pantallas -name "*.png" | wc -l)
          echo "Total de archivos PNG en biblioteca oficial SGCI-pantallas: $TOTAL_SGCI_PNG"
          if [ "$TOTAL_SGCI_PNG" -lt 47 ]; then
            echo "Error: Faltan capturas PNG de la biblioteca oficial SGCI-pantallas."
            exit 1
          fi

  backend-laravel-tdd:
    name: 2. Backend PHP 8.2+ / Laravel 11 — Linter & TDD (40/40 Pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout del repositorio SGCI
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, dom, xml
          coverage: none

      - name: Validar sintaxis estricta PHP en Módulos y Pruebas
        run: |
          find app tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Ejecutar Suite TDD de las 12 Suites Backend (40/40 Pruebas)
        run: |
          php scripts/ejecutar-pruebas-tdd.php

  frontend-vue-vitest-tdd:
    name: 3. Frontend Vue 3 + TypeScript + Pinia — TDD (32/32 Pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del repositorio SGCI
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar Suite TDD Frontend de las 12 Suites (32/32 Pruebas)
        run: node scripts/ejecutar-pruebas-frontend.mjs
